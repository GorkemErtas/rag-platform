services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: playable-factory-postgres
    environment:
      POSTGRES_DB: playable_factory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playable_factory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
